# YASB Reborn (v2.0.8+) Status Bar Configuration Template
# Processed dynamically via scripts/sync-theme.ps1
# Token Dependencies:
#   - #292e42
#   - 32
#   - {{perf.yasb.*}} (blur_enabled, acrylic_enabled, round_corners, media_interval_ms,
#                     clock_interval_ms, cpu_interval_ms, memory_interval_ms,
#                     traffic_interval_ms, animation_duration_ms)
# Reload Instructions:
#   Hot-reloads automatically via watch_config: true, or restart YASB daemon:
#   powershell -File .\scripts\watchdog.ps1 -Action Restart

watch_stylesheet: true
watch_config: true

bars:
  main-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
      center: false
    blur_effect:
      enabled: true
      acrylic: false
      dark: true
      round_corners: true
      round_corners_type: "normal"
      border_color: "#292e42"
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 32
    padding:
      top: 0
      left: 6
      bottom: 0
      right: 6
    widgets:
      left:
        - "komorebi_workspaces"
        - "active_window"
      center:
        - "media"
        - "clock"
      right:
        - "cpu"
        - "memory"
        - "traffic"
        - "volume"
        - "systray"
        - "power_menu"

widgets:
  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "󰘳 Komorebi Offline"
      label_workspace_btn: "{index}"
      label_workspace_active_btn: "{index}"
      label_workspace_populated_btn: "{index}"
      label_default_name: "{index}"
      label_zero_index: false
      hide_empty_workspaces: false
      hide_if_offline: false
      enable_scroll_switching: true
      reverse_scroll_direction: false
      app_icons:
        enabled_populated: false
        enabled_active: false
      toggle_workspace_layer:
        enabled: true
        tiling_label: "󱂬 Tiling"
        floating_label: "󱂭 Floating"

  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "{win[process][name]} ({win[title]})"
      label_no_window: "󰇄 Desktop"
      label_icon: true
      label_icon_size: 14
      max_length: 50
      monitor_exclusive: true

  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "<span>󰎈</span> {title} - {artist}"
      label_alt: "<span>󰎈</span> {title}"
      update_interval: 1000
      max_field_size:
        label: 32
        label_alt: 24
      show_thumbnail: false
      hide_empty: true
      controls_only: false
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "play_pause"
        on_right: "next_track"

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "<span>󰥔</span> {%H:%M}"
      label_alt: "<span>󰃭</span> {%a, %b %d %Y} <span>󰥔</span> {%H:%M:%S}"
      update_interval: 1000
      timezones: []
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_calendar"
      calendar:
        blur: true
        round_corners: true

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>󰍛</span> {info[percent][total]}%"
      label_alt: "<span>󰍛</span> {info[freq][current]}MHz"
      update_interval: 2000
      cpu_thresholds:
        low: 25
        medium: 60
        high: 85
      callbacks:
        on_left: "toggle_label"
        on_right: "exec taskmgr.exe"

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>󰘚</span> {virtual_mem_percent}%"
      label_alt: "<span>󰘚</span> {virtual_mem_used}/{virtual_mem_total}"
      update_interval: 3000
      hide_decimal: true
      memory_thresholds:
        low: 40
        medium: 70
        high: 90
      callbacks:
        on_left: "toggle_label"
        on_right: "exec resmon.exe"

  traffic:
    type: "yasb.traffic.TrafficWidget"
    options:
      label: "<span>󰕒</span> {upload_speed} <span>󰇚</span> {download_speed}"
      label_alt: "<span>󰲝</span> Up: {upload_speed} | Down: {download_speed}"
      update_interval: 2000
      speed_unit: "bytes"
      hide_if_offline: false
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"
        on_right: "exec ncpa.cpl"

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}%"
      label_alt: "<span>{icon}</span> {volume[percent]}%"
      volume_icons:
        - "󰝟"
        - "󰕿"
        - "󰖀"
        - "󰖀"
        - "󰕾"
      scroll_step: 2
      slider_beep: false
      audio_menu:
        blur: true
        round_corners: true
      callbacks:
        on_left: "toggle_volume_menu"
        on_middle: "toggle_mute"
        on_right: "toggle_mute"

  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "󰅁"
      label_expanded: "󰅂"
      label_position: "right"
      icon_size: 16
      pin_click_modifier: "alt"
      show_in_popup: true
      icons_per_row: 5

  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "󰐥"
      uptime: true
      show_user: true
      menu_style: "popup"
      popup:
        blur: true
        round_corners: true
      animation_duration: 150
      button_row: 5
