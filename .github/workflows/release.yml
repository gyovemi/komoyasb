name: Production Release Packaging

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'ui/pnpm-lock.yaml'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build Production Release (NSIS)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build-release.ps1 -Strict

      - name: Compute Checksums (SHA256SUMS.txt)
        shell: powershell
        run: |
          $checksumLines = Get-ChildItem -Path "dist\*.exe" | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllLines("dist\SHA256SUMS.txt", [string[]]$checksumLines, $utf8NoBom)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.sha256
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
